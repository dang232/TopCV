# Playwright E2E — run manually until dev servers + secrets are wired for CI.
name: E2E (Playwright)

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter my-app exec playwright install --with-deps

      - name: Run Playwright
        run: pnpm --filter my-app test:e2e
        env:
          CI: 'true'
          E2E_BASE_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_KEYCLOAK_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_KEYCLOAK_REALM: ci
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ci
